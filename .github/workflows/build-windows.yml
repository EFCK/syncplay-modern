name: Build Windows (PyInstaller)

# Builds the syncplay-modern fork on a Windows runner using
# build/syncplay-modern.spec. Triggers on version tags (auto) and
# manual dispatch (the "Run workflow" button in the Actions UI).
#
# The build does NOT bundle libvlc — users install VLC separately and
# the new "VLC location" field in the connect dialog points the runtime
# at it. Same model the Linux script uses today.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN defaults to read-only since the 2023 security tightening.
# softprops/action-gh-release needs to create / update a GitHub Release,
# which is a write to the Contents API — grant it explicitly here.
permissions:
  contents: write

# Opt into Node 24 runtime for JS-based actions ahead of GitHub's
# 2026-06-02 forced flip. Most pinned actions here still ship Node 20
# wrappers as of writing; this env makes them run on Node 24 so we can
# catch any incompatibility now instead of on the deadline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pyinstaller

      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm build/syncplay-modern.spec

      - name: Show what got built
        run: |
          dir dist
          if (Test-Path dist/syncplay-modern) { dir dist/syncplay-modern | Select-Object -First 20 }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $ver = (Get-Content syncplay/__init__.py | Select-String "version").ToString().Split("'")[1]
          echo "VER=$ver" >> $env:GITHUB_OUTPUT

      - name: Zip the bundle
        run: Compress-Archive -Path dist/syncplay-modern -DestinationPath dist/syncplay-modern-${{ steps.ver.outputs.VER }}-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncplay-modern-${{ steps.ver.outputs.VER }}-windows
          path: dist/syncplay-modern-${{ steps.ver.outputs.VER }}-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/syncplay-modern-${{ steps.ver.outputs.VER }}-windows.zip
